<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 12" width="960" height="12" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E59B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E59B" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00E59B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    /* Rests centred (0% and the visible default); motion is a slow sweep. */
    .pulse { animation: sweep 9s cubic-bezier(.45,0,.55,1) 1s infinite; }
    @keyframes sweep { 0% { transform: translateX(0); } 45% { transform: translateX(560px); } 45.01% { transform: translateX(-560px); } 100% { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <rect x="0" y="5.5" width="960" height="1" fill="#8A9590" opacity="0.35"/>
  <rect x="476" y="3" width="8" height="6" fill="#00E59B" transform="rotate(45 480 6)" opacity="0.9"/>
  <g class="pulse"><rect x="360" y="5" width="240" height="2" fill="url(#g)"/></g>
</svg>
