<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d">
  <title id="t">CodesbyRohit — Rohit Srivastava</title>
  <desc id="d">Building AI systems that show their evidence. Focus: evidence-grounded AI, data integrity, offline-first systems.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F0E"/>
      <stop offset="0.45" stop-color="#151A18"/>
      <stop offset="0.55" stop-color="#121715"/>
      <stop offset="1" stop-color="#080B0A"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#00E59B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00E59B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7F5"/>
      <stop offset="1" stop-color="#B8C3BE"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E59B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E59B" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00E59B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E59B" stop-opacity="0"/>
      <stop offset="1" stop-color="#00E59B" stop-opacity="0.07"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#B8C3BE" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="958" height="338" rx="18"/></clipPath>
    <mask id="typed" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="340">
      <rect class="reveal" x="0" y="0" width="960" height="340" fill="#fff"/>
    </mask>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .sans { font-family: 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Inter, Arial, sans-serif; }
    .label { fill: #B8C3BE; font-size: 12px; letter-spacing: 3px; }
    .emerald { fill: #00E59B; }

    /* Every animation starts AND ends fully visible (0% and 100% keyframes are
       the resting state). A renderer that freezes the image at its first frame,
       ignores CSS animation or honours reduced motion therefore always shows
       the complete hero; motion is decoration only. */
    .scan { animation: scan 7s cubic-bezier(.45,0,.55,1) 1.2s infinite; transform: translateY(-40px); }
    .reveal { animation: type 4s linear 0s 1 forwards; }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    .rule { transform-origin: 480px 0; animation: grow 4s linear 0s 1 forwards; }
    .pulse { animation: pulse 4s ease-in-out 2s infinite; }
    .fade { animation: fade 4.6s linear 0s 1 forwards; }

    @keyframes scan { 0% { transform: translateY(-40px); } 55% { transform: translateY(380px); } 100% { transform: translateY(380px); } }
    /* "terminal reset": visible, cleared, retyped character by character, visible */
    @keyframes type {
      0% { transform: translateX(0); }
      2% { transform: translateX(-800px); }
      15% { transform: translateX(-800px); animation-timing-function: steps(64, end); }
      82%, 100% { transform: translateX(0); }
    }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @keyframes grow {
      0% { transform: scaleX(1); }
      2% { transform: scaleX(0); }
      5% { transform: scaleX(0); animation-timing-function: cubic-bezier(.2,.7,.2,1); }
      40%, 100% { transform: scaleX(1); }
    }
    @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes fade { 0% { opacity: 1; } 2% { opacity: 0; } 72% { opacity: 0; animation-timing-function: ease-out; } 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .scan, .reveal, .cursor, .rule, .pulse, .fade { animation: none; }
      .scan { opacity: 0; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="960" height="340" fill="url(#metal)"/>
    <rect width="960" height="340" fill="url(#grid)"/>
    <rect width="960" height="340" fill="url(#core)"/>
    <!-- brushed-metal sheen -->
    <path d="M0 0 L960 0 L960 120 Q 480 60 0 150 Z" fill="#F4F7F5" opacity="0.025"/>

    <!-- scanning line with a faint trail -->
    <g class="scan">
      <rect x="0" y="-36" width="960" height="36" fill="url(#trail)"/>
      <rect x="0" y="0" width="960" height="1.5" fill="url(#beam)"/>
    </g>
  </g>

  <!-- frame and HUD corners -->
  <rect x="1" y="1" width="958" height="338" rx="18" fill="none" stroke="#B8C3BE" stroke-opacity="0.18"/>
  <g fill="none" stroke="#B8C3BE" stroke-opacity="0.55" stroke-width="1.5">
    <path d="M28 52 V28 H52"/><path d="M908 28 H932 V52"/>
    <path d="M28 288 V312 H52"/><path d="M908 312 H932 V288"/>
  </g>
  <rect x="26" y="26" width="4" height="4" class="emerald pulse"/>

  <!-- top labels -->
  <text x="64" y="44" class="mono label">PROFILE // CODESBYROHIT</text>
  <text x="896" y="44" class="mono label" text-anchor="end">MUMBAI · IN</text>

  <!-- identity -->
  <text x="480" y="148" class="sans" font-size="74" font-weight="700" letter-spacing="1" text-anchor="middle" fill="url(#title)">CodesbyRohit</text>
  <rect class="rule" x="300" y="170" width="360" height="1.5" fill="url(#beam)"/>
  <text x="480" y="200" class="mono" font-size="15" letter-spacing="9" text-anchor="middle" fill="#B8C3BE">ROHIT SRIVASTAVA</text>

  <!-- typed tagline -->
  <!-- centred, cursor inside the same text run so it stays attached whatever the font -->
  <g mask="url(#typed)">
    <text x="480" y="250" class="mono" font-size="22" fill="#F4F7F5" text-anchor="middle"><tspan class="emerald">&gt;</tspan> building AI systems that show their evidence<tspan class="emerald cursor">▍</tspan></text>
  </g>

  <!-- focus line -->
  <g class="fade mono" font-size="12" letter-spacing="2.5" fill="#B8C3BE" text-anchor="middle">
    <text x="480" y="300">EVIDENCE-GROUNDED AI  <tspan class="emerald">◆</tspan>  DATA INTEGRITY  <tspan class="emerald">◆</tspan>  OFFLINE-FIRST SYSTEMS</text>
  </g>
</svg>
